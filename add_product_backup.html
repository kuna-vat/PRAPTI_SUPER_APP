<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - PRAPTI GROCERY</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <h2>PRAPTI GROCERY</h2>
</header>

<div class="container">

<h2>Add Product</h2>

<form id="productForm">

<label>Product Name</label>
<input type="text" id="name" required>

<label>Brand</label>
<input type="text" id="brand">

<label>Category</label>
<select id="category">
<option>Rice</option>
<option>Atta & Flour</option>
<option>Dal & Pulses</option>
<option>Oil & Ghee</option>
<option>Milk & Dairy</option>
<option>Biscuit</option>
<option>Beverage</option>
<option>Others</option>
</select>

<label>Purchase Price</label>
<input type="number" id="purchase">

<label>Retail Price</label>
<input type="number" id="retail">

<label>Wholesale Price</label>
<input type="number" id="wholesale">

<label>Current Stock</label>
<input type="number" id="stock">

<label>Unit</label>
<select id="unit">
<option>pcs</option>
<option>kg</option>
<option>gm</option>
<option>ltr</option>
<option>ml</option>
</select>

<button type="submit">Save Product</button>

</form>

</div>

<script src="js/add_product.js"></script>

</body>
</html>
