<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRAPTI BAZAAR - Add Product</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:600px;
    margin:30px auto;
    padding:25px;
    background:white;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
    text-align:center;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

.image-box{
    border:2px dashed #aaa;
    border-radius:12px;
    padding:20px;
    text-align:center;
}

#imagePreview{
    display:none;
    max-width:220px;
    max-height:220px;
    margin:15px auto;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#6c2bd9;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    background:#aaa;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>PRAPTI BAZAAR</h1>
<h2>Add New Product</h2>

<form id="productForm">

<div class="form-group">
<label>Product Name</label>
<input
    type="text"
    id="name"
    required
    placeholder="Example: Red Cow Milk">
</div>

<div class="form-group">
<label>Brand</label>
<input
    type="text"
    id="brand"
    placeholder="Example: Red Cow">
</div>

<div class="form-group">
<label>Category</label>

<select id="category" required>

<option value="">Select Category</option>
<option value="Grocery">Grocery</option>
<option value="Fruits & Vegetables">Fruits & Vegetables</option>
<option value="Dairy & Eggs">Dairy & Eggs</option>
<option value="Beverages">Beverages</option>
<option value="Snacks">Snacks</option>
<option value="Personal Care">Personal Care</option>
<option value="Home Care">Home Care</option>
<option value="Puja Essentials">Puja Essentials</option>

</select>
</div>

<div class="form-group">
<label>Selling Price (₹)</label>
<input
    type="number"
    id="price"
    min="0"
    step="0.01"
    required>
</div>

<div class="form-group">
<label>MRP (₹)</label>
<input
    type="number"
    id="mrp"
    min="0"
    step="0.01">
</div>

<div class="form-group">
<label>Stock Quantity</label>
<input
    type="number"
    id="stock"
    min="0"
    required>
</div>

<div class="form-group">

<label>Product Image</label>

<div class="image-box">

<input
    type="file"
    id="image"
    accept="image/jpeg,image/png,image/webp"
    required>

<img id="imagePreview" alt="Product Preview">

<p>JPG, PNG or WebP</p>
<p>Maximum recommended size: 5 MB</p>

</div>

</div>

<button type="submit" id="submitBtn">
Upload Product
</button>

<div id="message"></div>

</form>

</div>

<script>

const imageInput = document.getElementById("image");
const imagePreview = document.getElementById("imagePreview");

imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        imagePreview.style.display = "none";
        return;
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if(!allowedTypes.includes(file.type)){

        alert("Only JPG, PNG and WebP images are allowed.");

        this.value = "";
        imagePreview.style.display = "none";

        return;
    }

    if(file.size > 5 * 1024 * 1024){

        alert("Image size must be below 5 MB.");

        this.value = "";
        imagePreview.style.display = "none";

        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        imagePreview.src = e.target.result;
        imagePreview.style.display = "block";

    };

    reader.readAsDataURL(file);

});


document.getElementById("productForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const file = imageInput.files[0];

    if(!file){
        alert("Please select a product image.");
        return;
    }

    const formData = new FormData();

    formData.append(
        "name",
        document.getElementById("name").value
    );

    formData.append(
        "brand",
        document.getElementById("brand").value
    );

    formData.append(
        "category",
        document.getElementById("category").value
    );

    formData.append(
        "price",
        document.getElementById("price").value
    );

    formData.append(
        "mrp",
        document.getElementById("mrp").value
    );

    formData.append(
        "stock",
        document.getElementById("stock").value
    );

    formData.append("image", file);

    const button =
        document.getElementById("submitBtn");

    const message =
        document.getElementById("message");

    button.disabled = true;
    button.innerText = "Uploading...";

    try{

        const response = await fetch(
            "http://127.0.0.1:5000/api/products",
            {
                method:"POST",
                body:formData
            }
        );

        const result = await response.json();

        if(response.ok){

            message.innerText =
                "Product uploaded successfully!";

            message.style.color = "green";

            document.getElementById("productForm").reset();

            imagePreview.style.display = "none";

        }else{

            message.innerText =
                result.error || "Upload failed.";

            message.style.color = "red";

        }

    }catch(error){

        message.innerText =
            "Backend server is not running.";

        message.style.color = "red";

    }

    button.disabled = false;
    button.innerText = "Upload Product";

});

</script>

</body>
</html>
